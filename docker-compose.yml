services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resto_qr
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    # Le backend lance `alembic upgrade head` à son démarrage : sans attendre
    # que Postgres accepte réellement les connexions, la migration échoue et le
    # conteneur s'arrête (`depends_on` seul n'attend que le démarrage du
    # conteneur, pas la disponibilité du service).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resto_qr"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/resto_qr
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
